<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisek JP - ฝึกสะกดคันจิและฮิระงะนะ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&family=Kanit:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-soft: #6c5ce7;
            --jp-dark: #2c3e50;
            --bg-color: #f1f2f6;
        }

        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-color); padding-bottom: 80px; }
        .kanit { font-family: 'Kanit', sans-serif; }

        .combo-card {
            background: white;
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: 0.3s ease;
            height: 100%;
            border: none;
        }

        .combo-card:hover { transform: translateY(-5px); }

        .main-word { font-size: 3.5rem; font-weight: 800; color: var(--jp-dark); margin: 10px 0; }
        .hira-display { font-size: 1.5rem; color: var(--primary-soft); font-weight: 600; margin-bottom: 5px; }
        
        .info-box {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 0.9rem;
            text-align: left;
        }

        .voice-btn {
            background: var(--primary-soft);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: 600;
            width: 100%;
            margin-top: 15px;
            transition: 0.2s;
        }

        .voice-btn:hover { background: #5649c0; }
        .status-msg { height: 24px; font-size: 0.9rem; color: var(--primary-soft); font-weight: 600; margin-top: 10px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark sticky-top">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand kanit fw-bold" href="index.html">Kanit Sound Combiner</a>
        <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-4">Home</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="text-center mb-5">
        <h2 class="kanit fw-bold">ฝึกสะกดคำศัพท์คันจิ</h2>
        <p class="text-muted">ระบบจะแยกเสียงอ่านจากฮิระงะนะทีละตัว แล้วค่อยอ่านรวมเป็นคำครับ</p>
    </div>

    <div class="row g-4" id="comboGrid"></div>
</div>

<script>
    let combinationsData = [];

    async function loadCombinations() {
        try {
            // ดึงข้อมูลจากไฟล์ JSON ของ 先生
            const response = await fetch('combinations.json');
            combinationsData = await response.json();
            const grid = document.getElementById('comboGrid');
            grid.innerHTML = "";

            combinationsData.forEach((item, index) => {
                const col = document.createElement('div');
                col.className = 'col-md-6 col-lg-4';
                col.innerHTML = `
                    <div class="combo-card shadow-sm">
                        <div class="hira-display">${item.ฮิระงะนะ}</div>
                        <div class="main-word">${item.คันจิ}</div>
                        
                        <div class="info-box">
                            <div><strong>Onyomi:</strong> ${item.Onyomi}</div>
                            <div><strong>Kunyomi:</strong> ${item.Kunyomi}</div>
                            <div class="text-primary mt-1"><strong>คำอ่านไทย:</strong> ${item.คำอ่านไทย}</div>
                        </div>

                        <div class="fw-bold text-danger fs-5">แปล: ${item.ความหมายไทย}</div>
                        
                        <div id="status-${index}" class="status-msg"></div>
                        <button class="voice-btn" onclick="playStepByStep(${index})">
                            <i class="bi bi-play-circle-fill me-2"></i>สะกดเสียงฮิระงะนะ
                        </button>
                    </div>
                `;
                grid.appendChild(col);
            });
        } catch (error) {
            console.error("Error:", error);
            document.getElementById('comboGrid').innerHTML = "<p class='text-center'>ไม่สามารถโหลดไฟล์ JSON ได้ (กรุณาใช้ Live Server)</p>";
        }
    }

    async function playStepByStep(index) {
        const item = combinationsData[index];
        const statusMsg = document.getElementById(`status-${index}`);
        
        // แยกตัวอักษรจาก "ฮิระงะนะ" อัตโนมัติ (เช่น "おぼえる" -> ["お", "ぼ", "え", "る"])
        // และจัดการตัวควบขนาดเล็กให้อ่านรวมกับตัวหน้าอัตโนมัติ
        const chars = item.ฮิระงะนะ.match(/[\u3040-\u309F][ゃゅょャュョ]?/g) || [];
        
        window.speechSynthesis.cancel();
        
        // 1. อ่านสะกดทีละตัว
        for (let char of chars) {
            statusMsg.innerText = `กำลังสะกด: ${char}`;
            await speak(char, 0.7); 
            await delay(500); 
        }

        // 2. อ่านรวมคำ (อ่านจาก ฮิระงะนะ)
        statusMsg.innerText = `อ่านรวมว่า: ${item.ฮิระงะนะ}`;
        await speak(item.ฮิระงะนะ, 1.0); 
        
        setTimeout(() => { statusMsg.innerText = ""; }, 2000);
    }

    function speak(text, rate) {
        return new Promise((resolve) => {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ja-JP';
            msg.rate = rate;
            msg.onend = resolve;
            window.speechSynthesis.speak(msg);
        });
    }

    function delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    loadCombinations();
</script>
</body>
</html>
