<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisek JP - Sound Combiner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&family=Kanit:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary-soft: #6c5ce7; --type-sep: #00cec9; --type-comb: #fd79a8; --type-vs: #ff9f43; --bg-color: #f1f2f6; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-color); padding-bottom: 80px; }
        .kanit { font-family: 'Kanit', sans-serif; }
        .combo-card { background: white; border-radius: 30px; padding: 30px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); transition: 0.3s ease; height: 100%; position: relative; }
        
        .type-badge { position: absolute; top: 20px; left: 20px; padding: 5px 15px; border-radius: 50px; font-size: 0.75rem; font-weight: 700; color: white; }
        .bg-sep { background-color: var(--type-sep); }
        .bg-comb { background-color: var(--type-comb); }
        .bg-vs { background-color: var(--type-vs); } /* สีสำหรับเปรียบเทียบเสียง */

        .main-word { font-size: 3rem; font-weight: 800; color: #2d3436; margin: 10px 0; letter-spacing: 2px; }
        .formula-text { font-size: 1.3rem; color: var(--primary-soft); font-weight: 600; margin-bottom: 10px; }
        .voice-btn { background: var(--primary-soft); color: white; border: none; padding: 10px 25px; border-radius: 50px; font-weight: 600; transition: 0.2s; box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3); width: 100%; }
        .voice-btn:hover { transform: scale(1.05); background: #5649c0; }
        .status-msg { height: 24px; font-size: 0.9rem; color: var(--primary-soft); font-weight: 600; margin-top: 10px; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark sticky-top">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand kanit fw-bold" href="index.html">JP Sound Combiner</a>
        <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-4">Home</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="text-center mb-5">
        <h2 class="kanit fw-bold">ฝึกสะกดและเปรียบเทียบเสียง</h2>
        <p class="text-muted">คลิกปุ่มเพื่อฟังการออกเสียงแยกทีละคำและรวมประโยค</p>
    </div>
    <div class="row g-4" id="comboGrid"></div>
</div>

<script>
    let combinationsData = [];

    async function loadCombinations() {
        try {
            // ดึงไฟล์ JSON (ใส่ timestamp กัน cache)
            const response = await fetch('combinations.json?v=' + new Date().getTime());
            if (!response.ok) throw new Error('Load failed');
            
            combinationsData = await response.json();
            const grid = document.getElementById('comboGrid');
            grid.innerHTML = ""; 

            combinationsData.forEach((item, index) => {
                // เลือกสี Badge ตามประเภท
                let badgeClass = "bg-sep";
                if(item.type === "ควบ") badgeClass = "bg-comb";
                if(item.type === "สั้น vs ยาว") badgeClass = "bg-vs";

                // ดึงข้อมูลโดยรองรับทั้ง Key ภาษาไทยและอังกฤษ
                const displayHira = item.ฮิระงะนะ || item.hira || "";
                const displayWord = item.คันจิ || item.word || displayHira;
                const displayRomaji = item.romaji || item.Kunyomi || "";
                const displayThaiRead = item.คำอ่านไทย || item.reading || "";
                const displayMeaning = item.ความหมายไทย || item.meaning || "";

                const col = document.createElement('div');
                col.className = 'col-md-6 col-lg-4';
                col.innerHTML = `
                    <div class="combo-card">
                        <span class="type-badge ${badgeClass}">${item.type || 'ทั่วไป'}</span>
                        <div class="text-end" style="font-size: 2rem;">${item.emoji || '📖'}</div>
                        <div class="formula-text">${displayHira}</div>
                        <div class="main-word">${displayWord}</div>
                        <div class="badge bg-light text-dark border mb-2">${displayRomaji}</div>
                        <div class="mt-1 text-muted small">อ่านว่า: ${displayThaiRead}</div>
                        <div class="fw-bold text-danger mt-2">แปล: ${displayMeaning}</div>
                        
                        <div id="status-${index}" class="status-msg"></div>
                        <button class="voice-btn" onclick="playStepByStep(${index})">
                            <i class="bi bi-play-circle-fill me-2"></i>ฟังการสะกดเสียง
                        </button>
                    </div>
                `;
                grid.appendChild(col);
            });
        } catch (error) {
            console.error("Error:", error);
            document.getElementById('comboGrid').innerHTML = `<p class='text-center'>เกิดข้อผิดพลาดในการโหลดข้อมูล</p>`;
        }
    }

    async function playStepByStep(index) {
        const item = combinationsData[index];
        const statusMsg = document.getElementById(`status-${index}`);
        window.speechSynthesis.cancel();
        
        // ดึงรายการตัวที่จะอ่านจาก chars (รองรับทั้งแยกตัวอักษรหรือคำเปรียบเทียบ)
        const charsToRead = item.chars || [];
        const finalWord = item.word || item.คันจิ || item.ฮิระงะนะ || "";

        for (let char of charsToRead) {
            statusMsg.innerText = `กำลังอ่าน: ${char}`;
            await speak(char, 0.8); 
            await delay(700); 
        }

        statusMsg.innerText = `อ่านรวม: ${finalWord}`;
        await speak(finalWord, 0.9); 
        setTimeout(() => { statusMsg.innerText = ""; }, 2000);
    }

    function speak(text, rate) {
        return new Promise((resolve) => {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ja-JP';
            msg.rate = rate;
            msg.onend = resolve;
            window.speechSynthesis.speak(msg);
        });
    }

    function delay(ms) { return new Promise(resolve => setTimeout(resolve, ms)); }

    loadCombinations();
</script>
</body>
</html>
