<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisek JP - ฝึกอ่านแยกเสียงและรวมคำ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&family=Kanit:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-soft: #6c5ce7;
            --type-sep: #00cec9;
            --type-comb: #fd79a8;
            --bg-color: #f1f2f6;
        }

        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-color); padding-bottom: 80px; }
        .kanit { font-family: 'Kanit', sans-serif; }

        .combo-card {
            background: white;
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            border: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            transition: 0.3s ease;
            height: 100%;
            position: relative;
        }

        .type-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            color: white;
        }
        .bg-sep { background-color: var(--type-sep); }
        .bg-comb { background-color: var(--type-comb); }

        .main-word { font-size: 3.5rem; font-weight: 800; color: #2d3436; margin: 15px 0; letter-spacing: 5px; }
        .formula-text { font-size: 1.5rem; color: var(--primary-soft); font-weight: 600; margin-bottom: 10px; }
        
        .voice-btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 20px;
        }

        .voice-btn {
            background: var(--primary-soft);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            font-weight: 600;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        .voice-btn:hover { transform: scale(1.05); background: #5649c0; }
        .voice-btn:active { transform: scale(0.95); }

        .status-msg { height: 24px; font-size: 0.9rem; color: var(--primary-soft); font-weight: 600; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark sticky-top">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand kanit fw-bold" href="index.html">JP Sound Combiner</a>
        <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-4">Home</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="text-center mb-5">
        <h2 class="kanit fw-bold">ฝึกสะกดและรวมเสียง</h2>
        <p class="text-muted">ระบบจะอ่านออกเสียงทีละตัวก่อน แล้วจึงอ่านรวมเป็นคำครับ</p>
    </div>

    <div class="row g-4" id="comboGrid"></div>
</div>

<script>
    let combinationsData = []; // เก็บข้อมูลไว้ที่นี่เพื่อไม่ต้อง fetch ซ้ำ

    async function loadCombinations() {
        try {
            const response = await fetch('combinations.json');
            if (!response.ok) throw new Error('Network response was not ok');
            
            combinationsData = await response.json();
            const grid = document.getElementById('comboGrid');
            grid.innerHTML = ""; // ล้างข้อมูลเก่า

            combinationsData.forEach((item, index) => {
                const typeClass = item.type === "แยก" ? "bg-sep" : "bg-comb";
                const col = document.createElement('div');
                col.className = 'col-md-6 col-lg-4';
                col.innerHTML = `
                    <div class="combo-card">
                        <span class="type-badge ${typeClass}">อ่านแบบ${item.type}</span>
                        <div class="text-end" style="font-size: 2rem;">${item.emoji}</div>
                        <div class="formula-text">${item.hira}</div>
                        <div class="main-word">${item.word}</div>
                        <div class="badge bg-light text-dark border mb-2">${item.romaji}</div>
                        <div class="fw-bold text-danger">${item.meaning}</div>
                        
                        <div class="voice-btn-container">
                            <div id="status-${index}" class="status-msg"></div>
                            <button class="voice-btn" onclick="playStepByStep(${index})">
                                <i class="bi bi-play-circle-fill me-2"></i>ฟังการสะกดเสียง
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(col);
            });
        } catch (error) {
            console.error("Error:", error);
            document.getElementById('comboGrid').innerHTML = `
                <div class="col-12 text-center">
                    <div class="alert alert-danger">
                        ไม่สามารถโหลดไฟล์ combinations.json ได้<br>
                        <small>ตรวจสอบว่าคุณเปิดผ่าน Live Server (VS Code) หรืออัปโหลดขึ้นโฮสต์แล้วหรือยัง</small>
                    </div>
                </div>`;
        }
    }

    async function playStepByStep(index) {
        const item = combinationsData[index]; // ดึงข้อมูลจากตัวแปรที่โหลดไว้แล้ว
        const statusMsg = document.getElementById(`status-${index}`);
        
        window.speechSynthesis.cancel();
        
        // 1. อ่านทีละตัว
        if (item.chars && Array.isArray(item.chars)) {
            for (let char of item.chars) {
                statusMsg.innerText = `กำลังอ่าน: ${char}`;
                await speak(char, 0.7); 
                await delay(600); 
            }
        }

        // 2. อ่านรวมคำ
        statusMsg.innerText = `รวมเป็น: ${item.word}`;
        await speak(item.word, 1.0); 
        
        setTimeout(() => { statusMsg.innerText = ""; }, 2000);
    }

    function speak(text, rate) {
        return new Promise((resolve) => {
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'ja-JP';
            msg.rate = rate;
            msg.onend = resolve;
            window.speechSynthesis.speak(msg);
        });
    }

    function delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    // เรียกใช้งาน
    loadCombinations();
</script>
</body>
</html>
