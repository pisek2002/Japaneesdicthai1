<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisek JP - Fun Verbs (Hiragana Edition)</title>
    
    <!-- CSS Frameworks -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&family=Kanit:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --cartoon-red: #ff7675;
            --cartoon-purple: #a29bfe;
            --cartoon-green: #00b894;
            --jp-dark: #2d3436;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f0f2f5;
            padding-bottom: 100px;
        }

        .kanit { font-family: 'Kanit', sans-serif; }

        .navbar {
            background-color: #2c3e50;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* การ์ดสไตล์การ์ตูน */
        .verb-card {
            background: white;
            border-radius: 30px;
            padding: 25px 20px;
            text-align: center;
            border: 5px solid #edf2f7;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .verb-card:hover {
            transform: scale(1.08) rotate(-2deg);
            border-color: var(--cartoon-red);
            box-shadow: 0 20px 40px rgba(255, 118, 117, 0.2);
        }

        /* อนิเมชั่น Emoji */
        .verb-emoji {
            font-size: 4.5rem;
            margin-bottom: 15px;
            display: inline-block;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.1));
        }

        .verb-card:hover .verb-emoji {
            animation: cartoon-bounce 0.6s infinite;
        }

        @keyframes cartoon-bounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-20px) scale(1.1); }
        }

        /* ข้อความภาษาต่างๆ */
        .jp-text { 
            font-size: 1.9rem; 
            font-weight: 800; 
            color: var(--jp-dark); 
            line-height: 1.2;
        }

        .hira-text {
            font-size: 1.1rem;
            color: var(--cartoon-purple);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .romaji-text { 
            color: var(--cartoon-green); 
            font-weight: 700; 
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        .thai-reading { 
            color: #b2bec3; 
            font-size: 0.85rem; 
            font-style: italic; 
            margin-bottom: 10px;
        }

        .thai-meaning { 
            font-size: 1.3rem; 
            font-weight: 700; 
            color: #d63031; 
            background: #fff5f5;
            padding: 5px 15px;
            border-radius: 50px;
        }

        /* ปุ่มเล่นเสียง */
        .play-btn {
            background: var(--cartoon-red);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            margin-top: 15px;
            box-shadow: 0 5px 0 #d63031;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
        }

        .verb-card:hover .play-btn {
            transform: scale(1.1);
        }

        .play-btn:active {
            transform: translateY(4px) scale(1);
            box-shadow: 0 1px 0 #d63031;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark sticky-top">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand kanit fw-bold" href="index.html">
            <i class="bi bi-star-fill text-warning me-2"></i> Verbs (คำกริยา)
        </a>
        <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-4">กลับหน้าหลัก</a>
    </div>
</nav>

<div class="container mt-5">
    <div class="text-center mb-5">
        <h1 class="kanit fw-bold text-dark">คำกริยาภาษาญี่ปุ่น (Verbs)</h1>
        <p class="text-muted fs-5">กดที่การ์ดเพื่อฟังเสียงและดูอนิเมชั่นสนุกๆ นะครับ</p>
    </div>

    <!-- Grid แสดงการ์ดกริยา -->
    <div class="row g-4" id="verbsGrid">
        <!-- ข้อมูลจะโหลดมาจากไฟล์ verbs.json อัตโนมัติ -->
    </div>
</div>

<script>
    // ฟังก์ชันโหลดข้อมูลกริยาจาก JSON
    async function fetchVerbs() {
        try {
            const response = await fetch('verbs.json');
            const verbs = await response.json();
            const grid = document.getElementById('verbsGrid');

            verbs.forEach((item) => {
                const col = document.createElement('div');
                col.className = 'col-6 col-md-4 col-lg-3';
                
                // โครงสร้างการ์ดที่มีการเพิ่ม Hiragana เข้าไปตามคำขอ
                col.innerHTML = `
                    <div class="verb-card" onclick="speakJP('${item.jp}')">
                        <div class="verb-emoji">${item.emoji}</div>
                        <div class="jp-text">${item.jp}</div>
                        <div class="hira-text">(${item.hira})</div>
                        <div class="romaji-text">${item.romaji}</div>
                        <div class="thai-reading">${item.reading}</div>
                        <div class="thai-meaning">${item.th}</div>
                        <button class="play-btn">
                            <i class="bi bi-volume-up-fill fs-5"></i>
                        </button>
                    </div>
                `;
                grid.appendChild(col);
            });
        } catch (error) {
            console.error("โหลดข้อมูล JSON ไม่สำเร็จ:", error);
            document.getElementById('verbsGrid').innerHTML = "<div class='text-center w-100'>เกิดข้อผิดพลาดในการโหลดข้อมูล</div>";
        }
    }

    // ฟังก์ชันออกเสียงภาษาญี่ปุ่น
    function speakJP(text) {
        if (!window.speechSynthesis) return;
        
        window.speechSynthesis.cancel(); // หยุดเสียงเก่าก่อน
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'ja-JP';
        msg.rate = 0.85; // ความเร็วพอดีๆ
        msg.pitch = 1.1; // ปรับโทนเสียงให้ดูสดใสขึ้นแบบการ์ตูน
        window.speechSynthesis.speak(msg);
    }

    // เริ่มทำงานเมื่อเปิดหน้าเว็บ
    window.addEventListener('DOMContentLoaded', fetchVerbs);
</script>

</body>
</html>
