<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisek JP - Continuous Learning</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&family=Kanit:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --jp-green: #2ecc71;
            --jp-dark: #2c3e50;
            --jp-light: #f4f7f6;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            background-color: var(--jp-light);
            /* เว้นพื้นที่บน-ล่างเพื่อให้ประโยคแรกและสุดท้ายเลื่อนมาตรงกลางได้ */
            padding-top: 45vh;
            padding-bottom: 45vh;
            overflow-x: hidden;
        }

        .kanit { font-family: 'Kanit', sans-serif; }

        .navbar {
            background-color: var(--jp-dark);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .phrase-container {
            width: 95%;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 15px;
        }

        /* --- ปรับปรุง: การ์ดเรียงติดกันมากขึ้น --- */
        .phrase-card {
            background: white;
            border-radius: 25px;
            padding: 25px 20px; 
            margin-bottom: 20px; /* ลดระยะห่างเพื่อให้เรียงติดกัน */
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            opacity: 0.4; /* เพิ่มความชัดเจนเล็กน้อยสำหรับการ์ดที่ยังไม่ Active */
            transform: scale(0.9);
            border: 2px solid transparent;
            width: 100%;
        }

        /* --- เมื่อการ์ดอยู่กึ่งกลางหน้าจอ --- */
        .phrase-card.active {
            opacity: 1;
            transform: scale(1.1); /* ขยายใหญ่ขึ้น */
            border-color: var(--jp-green);
            box-shadow: 0 15px 30px rgba(46, 204, 113, 0.2);
            z-index: 10;
        }

        .thai-translation { font-weight: 600; color: #333; font-size: 1.1rem; margin-bottom: 5px; }
        .jp-text { color: var(--jp-dark); font-size: 1.8rem; font-weight: 700; margin-bottom: 5px; }
        .romaji-text { color: var(--jp-green); font-size: 1rem; font-weight: 600; }
        .thai-reading { color: #888; font-size: 0.9rem; font-style: italic; }
        
        .speaker-icon { margin-top: 10px; color: #ddd; font-size: 1.4rem; transition: 0.3s; }
        .active .speaker-icon { color: var(--jp-green); animation: pulse 1s infinite; }

        @media (min-width: 992px) {
            .phrase-card.active { transform: scale(1.2); }
            .jp-text { font-size: 2.2rem; }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark shadow-sm">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand kanit d-flex align-items-center" href="#">
            <i class="bi bi-translate me-2"></i> Pisek Learn JP
        </a>
        <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
            <i class="bi bi-house-door me-1"></i>
        </a>
    </div>
</nav>

<div class="phrase-container" id="phrasesList">
    </div>

<script>
    const listContainer = document.getElementById('phrasesList');
    let lastPlayedIndex = -1;
    let phrasesData = [];

    async function loadPhrases() {
        try {
            const response = await fetch('phrases.json');
            phrasesData = await response.json();

            phrasesData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'phrase-card';
                card.id = `phrase-${index}`;
                card.setAttribute('data-jp', item.jp);

                card.innerHTML = `
                    <div class="thai-translation">${item.th}</div>
                    <div class="jp-text">${item.jp}</div>
                    <div class="romaji-text">${item.romaji || ""}</div>
                    <div class="thai-reading">อ่านว่า: ${item.reading}</div>
                    <div class="speaker-icon">
                        <i class="bi bi-volume-up-fill"></i>
                    </div>
                `;
                listContainer.appendChild(card);
            });
            
            // ตรวจจับครั้งแรกเมื่อโหลดเสร็จ
            setTimeout(handleScroll, 100); 
        } catch (error) {
            console.error("Error:", error);
            listContainer.innerHTML = "<div class='text-center py-5'>ไม่พบไฟล์ข้อมูล phrases.json</div>";
        }
    }

    function playJPVoice(text) {
        if (!text) return;
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'ja-JP';
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
    }

    function handleScroll() {
        const viewportCenter = window.innerHeight / 2;
        const cards = document.querySelectorAll('.phrase-card');
        let closestCardIndex = -1;
        let minDistance = Infinity;

        cards.forEach((card, index) => {
            const rect = card.getBoundingClientRect();
            const cardCenter = rect.top + (rect.height / 2);
            const distance = Math.abs(cardCenter - viewportCenter);

            // หาการ์ดที่ใกล้กึ่งกลางมากที่สุด
            if (distance < minDistance) {
                minDistance = distance;
                closestCardIndex = index;
            }
        });

        // กำหนดระยะที่ยอมรับได้ (ยิ่งน้อย ยิ่งต้องตรงกลางจริงๆ ถึงจะทำงาน)
        if (closestCardIndex !== -1 && minDistance < 120) {
            if (closestCardIndex !== lastPlayedIndex) {
                cards.forEach(c => c.classList.remove('active'));
                const activeCard = cards[closestCardIndex];
                activeCard.classList.add('active');
                
                playJPVoice(activeCard.getAttribute('data-jp'));
                lastPlayedIndex = closestCardIndex;
            }
        } else {
            // ถ้าเลื่อนไปไกลจากจุดกลาง ให้เอาสถานะ active ออก (เลือกได้ว่าจะใช้ไหม)
            // cards.forEach(c => c.classList.remove('active'));
        }
    }

    // ใช้ throttle หรือ requestAnimationFrame เพื่อความลื่นไหลในการเลื่อน
    window.addEventListener('scroll', () => {
        window.requestAnimationFrame(handleScroll);
    });
    
    loadPhrases();
</script>

</body>
</html>
